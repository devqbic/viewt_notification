<!DOCTYPE html>
<html lang="ko">
<head>
    <script>
        if (location.protocol === 'https:') {
            location.replace(
                'http://' + location.host + location.pathname + location.search + location.hash
            );
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View-T | 서버 이전 안내</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                "Pretendard",
                "Noto Sans KR",
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #202125;
            color: #ffffff;
            overflow: hidden;
        }

        .page {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 650px;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(
                    circle at 80% 55%,
                    rgba(0, 159, 227, 0.10) 0%,
                    rgba(0, 159, 227, 0.025) 26%,
                    transparent 48%
                ),
                #202125;
        }

        .background-grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.15;
            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );
            background-size: 70px 70px;
            mask-image:
                linear-gradient(
                    to left,
                    rgba(0,0,0,1),
                    rgba(0,0,0,0)
                );
        }

        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            right: -100px;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 50%;
            background: rgba(0, 159, 227, 0.06);
            filter: blur(80px);
            pointer-events: none;
        }

        header {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 88px;
            display: flex;
            align-items: center;
            padding: 0 5.5vw;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .logo-symbol {
            position: relative;
            width: 42px;
            height: 42px;
            border: 2px solid #00a4e4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-symbol::before {
            content: "";
            width: 16px;
            height: 16px;
            border-left: 4px solid #ffffff;
            border-bottom: 4px solid #ffffff;
            transform: rotate(-45deg) translate(2px, -2px);
            opacity: 0.9;
        }

        .logo-text {
            display: flex;
            align-items: flex-end;
            gap: 7px;
        }

        .logo-name {
            font-size: 25px;
            font-style: italic;
            font-weight: 700;
            letter-spacing: -1px;
            color: #00a4e4;
        }

        .logo-version {
            margin-bottom: 4px;
            padding: 2px 5px;
            background: #008ed6;
            font-size: 9px;
            font-weight: 700;
            color: #fff;
        }

        main {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 10vw;
        }

        .content {
            width: 100%;
            max-width: 900px;
            transform: translateY(-20px);
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            color: #00a4e4;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .eyebrow::before {
            content: "";
            width: 34px;
            height: 2px;
            background: #00a4e4;
        }

        h1 {
            margin-bottom: 28px;
            font-size: clamp(38px, 4.2vw, 62px);
            line-height: 1.3;
            font-weight: 700;
            letter-spacing: -0.055em;
            word-break: keep-all;
        }

        h1 strong {
            color: #00a4e4;
            font-weight: inherit;
        }

        .description {
            margin-bottom: 42px;
            font-size: 17px;
            line-height: 1.9;
            color: #b6b9bf;
            letter-spacing: -0.02em;
            word-break: keep-all;
        }

        .maintenance-info {
            display: flex;
            align-items: stretch;
            max-width: 820px;
            border: 1px solid rgba(255,255,255,0.17);
            background: rgba(255,255,255,0.025);
            backdrop-filter: blur(10px);
        }

        .info-title {
            width: 170px;
            display: flex;
            align-items: center;
            padding: 26px 28px;
            border-right: 1px solid rgba(255,255,255,0.12);
            color: #92969d;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        .info-date {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 22px 28px;
        }

        .date-item {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .date-label {
            font-size: 12px;
            font-weight: 600;
            color: #00a4e4;
        }

        .date-item strong {
            font-size: 18px;
            font-weight: 650;
            color: #ffffff;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .date-arrow {
            color: #00a4e4;
            font-size: 22px;
            font-weight: 300;
        }

        footer {
            position: relative;
            z-index: 2;
            padding: 0 5.5vw 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #696c72;
            font-size: 11px;
        }

        .footer-name {
            color: #80838a;
        }

        .traffic-lines {
            position: absolute;
            right: -50px;
            top: 50%;
            width: 48vw;
            height: 65vh;
            transform: translateY(-45%);
            opacity: 0.16;
            pointer-events: none;
        }

        .traffic-lines span {
            position: absolute;
            display: block;
            width: 70%;
            height: 1px;
            right: 0;
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #00a4e4 25%,
                    #00a4e4 70%,
                    transparent
                );
            transform-origin: center;
        }

        .traffic-lines span:nth-child(1) { top: 20%; transform: rotate(-17deg); }
        .traffic-lines span:nth-child(2) { top: 33%; right: 5%; transform: rotate(-6deg); }
        .traffic-lines span:nth-child(3) { top: 46%; right: -2%; transform: rotate(8deg); }
        .traffic-lines span:nth-child(4) { top: 60%; right: 7%; transform: rotate(-11deg); }
        .traffic-lines span:nth-child(5) { top: 73%; right: -4%; transform: rotate(15deg); }
        .traffic-lines span:nth-child(6) { top: 52%; right: 15%; transform: rotate(31deg); }

        .traffic-lines i {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #00a4e4;
            box-shadow: 0 0 12px #00a4e4;
        }

        .traffic-lines i:nth-of-type(1) { top: 25%; right: 34%; }
        .traffic-lines i:nth-of-type(2) { top: 42%; right: 19%; }
        .traffic-lines i:nth-of-type(3) { top: 61%; right: 41%; }
        .traffic-lines i:nth-of-type(4) { top: 70%; right: 15%; }

        @media (max-width: 768px) {
            body {
                overflow: auto;
            }

            .page {
                min-height: 100svh;
                height: auto;
            }

            header {
                height: 75px;
                padding: 0 24px;
            }

            .logo-symbol {
                width: 36px;
                height: 36px;
            }

            .logo-name {
                font-size: 22px;
            }

            main {
                padding: 70px 25px;
            }

            .content {
                transform: none;
            }

            .eyebrow {
                margin-bottom: 18px;
                font-size: 12px;
            }

            h1 {
                margin-bottom: 22px;
                font-size: 34px;
                line-height: 1.38;
            }

            .description {
                margin-bottom: 30px;
                font-size: 15px;
                line-height: 1.8;
            }

            .description br {
                display: none;
            }

            .maintenance-info {
                display: block;
                width: 100%;
                max-width: none;
            }

            .info-title {
                width: auto;
                padding: 15px 20px;
                border-right: 0;
                border-bottom: 1px solid rgba(255,255,255,0.1);
            }

            .info-date {
                display: block;
                padding: 20px;
            }

            .date-item {
                gap: 5px;
            }

            .date-item strong {
                font-size: 16px;
            }

            .date-arrow {
                margin: 12px 0;
                transform: rotate(90deg);
                width: fit-content;
            }

            .traffic-lines {
                opacity: 0.08;
                width: 80vw;
            }

            footer {
                padding: 0 24px 22px;
                font-size: 9px;
            }

            footer > div:last-child {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="background-grid"></div>
    <div class="glow"></div>

    <div class="traffic-lines">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

        <i></i>
        <i></i>
        <i></i>
        <i></i>
    </div>

    <header>
        <div class="logo">
            
            <div class="logo-text">
                <span class="logo-name">View-T</span>
                <span class="logo-version">3.0</span>
            </div>
        </div>
    </header>

    <main>
        <section class="content">

            <div class="eyebrow">
                SYSTEM MAINTENANCE
            </div>

            <h1>
                서버 이전으로 인해<br>
                <strong>일시적으로 접속할 수 없습니다.</strong>
            </h1>

            <p class="description">
                보다 안정적인 서비스 제공을 위해 View-T 서버 이전 작업을 진행하고 있습니다.<br>
                작업 기간 동안 서비스 이용이 제한되오니 이용자 여러분의 양해 부탁드립니다.
            </p>

            <div class="maintenance-info">

                <div class="info-title">
                    서비스 중단 기간
                </div>

                <div class="info-date">

                    <div class="date-item">
                        <span class="date-label">서비스 중단</span>
                        <strong>2026. 08. 20 (목) 14:00</strong>
                    </div>

                    <div class="date-arrow">→</div>

                    <div class="date-item">
                        <span class="date-label">서비스 재개 예정</span>
                        <strong>2026. 08. 24 (월) 15:00</strong>
                    </div>

                </div>

            </div>

        </section>
    </main>

    <footer>
        
    </footer>

</div>

</body>
</html>
